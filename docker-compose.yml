services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: ca-backend
        # Expose makes the port available to other services on the user-defined network,
        # but not published to the host.
        expose:
            - "8080"
        environment:
            - PORT=8080
            # Fixed admin secret (optional). Without it a random one is
            # generated on every start: docker compose logs backend | grep SECRET
            - ADMIN_SECRET=${ADMIN_SECRET:-}
            # Leaderboard, sessions and player code survive restarts.
            # Wipe with: docker compose down -v
            - STATE_FILE=/data/arena-state.json
        volumes:
            - arena-data:/data
        restart: unless-stopped
        networks:
            - ca-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: ca-frontend
        # Local access only (http://localhost:8088 by default). Public traffic
        # comes in over the Docker network: cloudflared (tunnel) or, as a
        # fallback, a Caddy container joined to the "ca-network" network.
        ports:
            - "127.0.0.1:${ARENA_LOCAL_PORT:-8088}:80"
        depends_on:
            - backend
        restart: unless-stopped
        networks:
            - ca-network

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: ca-cloudflared
        depends_on:
            - frontend
        # Mount the local cloudflared config directory (contains config.yml and credentials json)
        volumes:
            - ./cloudflared:/etc/cloudflared:ro
        # Use the named tunnel created earlier. This avoids ephemeral --url usage and
        # ensures the route DNS points to the named tunnel.
        command: tunnel run concurrency-arena
        environment:
            # cloudflared requires an origin cert file (cert.pem). Place it at ./cloudflared/cert.pem
            - TUNNEL_ORIGIN_CERT=/etc/cloudflared/cert.pem
        restart: unless-stopped
        networks:
            - ca-network

volumes:
    arena-data:

networks:
    ca-network:
        # Fixed name so an external reverse proxy (fallback Caddy) can join it:
        #   docker network connect ca-network <caddy-container>
        name: ca-network
        driver: bridge
